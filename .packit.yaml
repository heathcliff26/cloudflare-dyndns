# See the documentation for more information:
# https://packit.dev/docs/configuration/

specfile_path: tmp/copr.spec
actions:
  post-upstream-clone:
    - mkdir -p tmp
    - cp tools/copr.spec tmp/
    - sed -i -e '/^PLACEHOLDER_POSTINSTALL$/r packages/linux/postinstall.sh' -e '/^PLACEHOLDER_POSTINSTALL$/d' tmp/copr.spec
    - sed -i -e '/^PLACEHOLDER_PREREMOVE$/r packages/linux/preremove.sh' -e '/^PLACEHOLDER_PREREMOVE$/d' tmp/copr.spec
    - sed -i -e '/^PLACEHOLDER_POSTREMOVE$/r packages/linux/postremove.sh' -e '/^PLACEHOLDER_POSTREMOVE$/d' tmp/copr.spec

# name in upstream package repository or registry (e.g. in PyPI)
upstream_package_name: cloudflare-dyndns
# downstream (Fedora) RPM package name
downstream_package_name: cloudflare-dyndns

jobs:
  - job: copr_build
    trigger: pull_request
    branch: main
    targets:
      - fedora-all-x86_64
      - fedora-all-aarch64
    enable_net: true

  - job: copr_build
    trigger: release
    targets:
      - fedora-all-x86_64
      - fedora-all-aarch64
    enable_net: true
    owner: heathcliff26
    project: cli
